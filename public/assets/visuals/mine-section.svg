<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 820 564" width="820" height="564" role="img" aria-labelledby="msTitle msDesc">
  <title id="msTitle">地下矿山系统剖面示意</title>
  <desc id="msDesc">竖井、三个中段的运输平巷、矿房与通风井的空间关系示意，含中段标高，非按比例。</desc>
  <defs>
    <pattern id="msGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#E4E0D5" stroke-width="0.7"/>
    </pattern>
    <pattern id="msHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9a6b15" stroke-width="1.25" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="820" height="620" fill="#FFFEFA"/>

  <rect x="0" y="140" width="820" height="480" fill="#F3F1E9"/>
  <rect y="140" width="820" height="480" fill="url(#msGrid)"/>

  <path d="M0 140H820" stroke="#152a45" stroke-width="2.6" stroke-linecap="square"/>
  <text x="26" y="128" font-family="Consolas, ui-monospace, monospace" font-size="11" fill="#6a6f7a">地表</text>

  <g stroke="#152a45" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M120 140L133 96"/>
    <path d="M146 140L133 96"/>
    <path d="M123 124H143"/>
  </g>
  <rect x="120" y="140" width="26" height="398" fill="#FFFEFA" stroke="#152a45" stroke-width="2.8"/>
  <text x="164" y="186" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5a5f6a">竖井</text>

  <rect x="146" y="262" width="610" height="16" fill="#FFFEFA" stroke="#152a45" stroke-width="2.6"/>
  <rect x="146" y="392" width="610" height="16" fill="#FFFEFA" stroke="#152a45" stroke-width="2.6"/>
  <rect x="146" y="522" width="610" height="16" fill="#FFFEFA" stroke="#152a45" stroke-width="2.6"/>

  <rect x="734" y="140" width="22" height="252" fill="#FFFEFA" stroke="#152a45" stroke-width="2.8"/>
  <text x="745" y="128" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5a5f6a">通风井</text>

  <rect x="360" y="278" width="240" height="17" fill="#152a45" opacity="0.18"/>
  <rect x="360" y="375" width="240" height="17" fill="#152a45" opacity="0.18"/>
  <rect x="360" y="295" width="240" height="80" fill="url(#msHatch)" stroke="#9a6b15" stroke-width="1.9"/>
  <g stroke="#9a6b15" stroke-width="1" stroke-dasharray="4 6" opacity="0.6">
    <path d="M362 322H598"/>
    <path d="M362 348H598"/>
  </g>

  <g stroke="#9a6b15" stroke-width="1" stroke-dasharray="3 4">
    <path d="M78 270H114"/>
    <path d="M78 400H114"/>
    <path d="M78 530H114"/>
  </g>
  <g text-anchor="end" font-family="Consolas, ui-monospace, monospace" font-size="11.5" fill="#9a6b15">
    <text x="72" y="274">−100 m</text>
    <text x="72" y="404">−200 m</text>
    <text x="72" y="534">−300 m</text>
  </g>

  <g stroke="#868c98" stroke-width="0.9" stroke-dasharray="3 3" fill="none">
    <path d="M470 250V262"/>
    <path d="M600 340L652 316"/>
  </g>
  <text x="470" y="246" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5a5f6a">阶段运输平巷</text>
  <text x="656" y="313" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5a5f6a">矿房</text>

  <text x="800" y="600" text-anchor="end" font-family="Consolas, ui-monospace, monospace" font-size="10.5" fill="#868c98">系统示意 · 非按比例</text>
</svg>
