"680" y="196" font-size="22" text-anchor="middle" fill="#A6531F" font-weight="bold">切顶密集支柱排</text><rect x="120" y="370" width="1180" height="90" fill="url(#ore)" stroke="#2A2118" stroke-width="3"/><text x="700" y="424" font-size="22" text-anchor="middle" fill="#2A2118" font-weight="normal">缓倾斜矿层（厚 &lt;3 m）· 底柱中漏口间距 5～7 m</text><line x1="120" y1="460" x2="1300" y2="460" stroke="#2A2118" stroke-width="4"/><line x1="120" y1="520" x2="680" y2="520" stroke="#2A2118" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="120" y1="508" x2="120" y2="532" stroke="#2A2118" stroke-width="1.4"/><line x1="680" y1="508" x2="680" y2="532" stroke="#2A2118" stroke-width="1.4"/><rect x="254.51999999999998" y="478" width="290.96" height="34" fill="#FDFAF2" opacity="0.94"/><text x="400.0" y="506" font-size="22" text-anchor="middle" fill="#2A2118" font-weight="normal">放顶距（1～5 排支柱间距）</text><line x1="680" y1="520" x2="860" y2="520" stroke="#2A2118" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="680" y1="508" x2="680" y2="532" stroke="#2A2118" stroke-width="1.4"/><line x1="860" y1="508" x2="860" y2="532" stroke="#2A2118" stroke-width="1.4"/><rect x="668.52" y="478" width="202.95999999999998" height="34" fill="#FDFAF2" opacity="0.94"/><text x="770.0" y="506" font-size="22" text-anchor="middle" fill="#2A2118" font-weight="normal">控顶距（2～3 排）</text><line x1="120" y1="565" x2="860" y2="565" stroke="#2A2118" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="120" y1="553" x2="120" y2="577" stroke="#2A2118" stroke-width="1.4"/><line x1="860" y1="553" x2="860" y2="577" stroke="#2A2118" stroke-width="1.4"/><rect x="326.04" y="523" width="327.91999999999996" height="34" fill="#FDFAF2" opacity="0.94"/><text x="490.0" y="551" font-size="22" text-anchor="middle" fill="#2A2118" font-weight="normal">悬顶距（最大 = 放顶 + 控顶）</text><text x="700" y="630" font-size="25" text-anchor="middle" fill="#2A2118" font-weight="bold">长壁式崩落：周期性放顶