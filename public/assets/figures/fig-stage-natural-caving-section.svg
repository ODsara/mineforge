<path d="M197 496 Q481 185 773 496" fill="none" stroke="#263844" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M182 437 Q481 88 788 437" fill="none" stroke="#166369" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/>
<rect x="156" y="445" width="36" height="25" fill="#fffdf7" stroke="#61737c" stroke-width="2"/>
<rect x="780" y="445" width="34" height="25" fill="#fffdf7" stroke="#61737c" stroke-width="2"/>
