</defs><rect width="1400" height="940" fill="#FDFAF2"/><rect x="120" y="80" width="120" height="740" fill="#EFE6D4" stroke="#2A2118" stroke-width="2"/><rect x="1180" y="80" width="120" height="740" fill="#EFE6D4" stroke="#2A2118" stroke-width="2"/><rect x="240" y="80" width="940" height="150" fill="url(#caved)" stroke="#2A2118" stroke-width="2.6"/><rect x="544.5" y="136" width="311.0" height="35" fill="#FDFAF2" opacity="0.94"/><text x="700" y="165" font-size="23" text-anchor="middle" fill="#2A2118" font-weight="normal">覆岩随崩落矿石下移自然崩落</text><rect x="240" y="230" width="940" height="420" fill="url(#ore)" stroke="#2A2118" stroke-width="3"/><path d="M240,650 Q400,360 700,350 Q1000,360 1180,650 Z" fill="url(#fillb)" stroke="#A6531F" stroke-width="3"/><rect x="535.3" y="401" width="329.40000000000003" height="35" fill="#FDFAF2" opacity="0.94"/><text x="700" y="430" font-size="23" text-anchor="middle" fill="#2A2118" font-weight="normal">崩落矿石（自由空间高 ≤5 m）</text><path d="M240,650 Q420,430 700,424 Q980,430 1180,650" fill="none" stroke="#2A2118" stroke-width="4" stroke-dasharray="18 12"/><rect x="487.0" y="363" width="426.0" height="35" fill="#FDFAF2" opacity="0.94"/><text x="700" y="392" font-size="23" text-anchor="middle" fill="#A6531F" font-weight="bold">平衡拱（切帮巷道移动支撑点使拱上移）</text><rect x="240" y="650" width="940" height="60" fill="#FDFAF2" stroke="#2A2118" stroke-width="3"/><text x="700" y="688" font-size="22" text-anchor="middle" fill="#2A2118" font-weight="normal">拉底空间（大面积拉底诱发崩落）</text><path d="M320,710 L400,710 L372,755 L348,755 Z" fill="#FDFAF2" stroke="#2A2118" stroke-width="2"/><path d="M520,710 L600,710 L572,755 L548,755 Z" fill="#FDFAF2" stroke="#2A2118" stroke-width="2"/><path d="M720,710 L800,710 L772,755 L748,755 Z" fill="#FDFAF2" stroke="#2A2118" stroke-width="2"/><path d="M920,710 L1000,710 L972,755 L948,755 Z" fill="#FDFAF2" stroke="#2A2118" stroke-width="2"/><rect x="240" y="755" width="940" height="40" fill="#FDFAF2" stroke="#2A2118" stroke-width="3"/><rect x="240" y="240" width="40" height="410" fill="#FDFAF2" stroke="#A6531F" stroke-width="2.4"/><rect x="1140" y="240" width="40" height="410" fill="#FDFAF2" stroke="#A6531F" stroke-width="2.4"/><line x1="120" y1="795" x2="1300" y2="795" stroke="#2A2118" stroke-width="4"/><line x1="255" y1="420" x2="120" y2="420" stroke="#2A2118" stroke-width="1.8"/><circle cx="255" cy="420" r="4" fill="#A6531F"/><rect x="119" y="391" width="288.0" height="35" fill="#FDFAF2" opacity="0.94"/><text x="125" y="420" font-size="23" text-anchor="start" fill="#2A2118" font-weight="normal">切帮巷道（控制崩落边界）</text><line x1="1155" y1="520" x2="1385" y2="520" stroke="#2A2118" stroke-width="1.8"/><circle cx="1155" cy="520" r="4" fill="#A6531F"/><rect x="1071.72" y="491" width="319.28" height="35" fill="#FDFAF2" opacity="0.94"/><text x="1385" y="520" font-size="23" text-anchor="end" fill="#2A2118" font-weight="normal">观察天井（距四角 8～12 m）</text><line x1="80" y1="80" x2="80" y2="795" stroke="#2A2118" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="68" y1="80" x2="92" y2="80" stroke="#2A2118" stroke-width="1.4"/><line x1="68" y1="795" x2="92" y2="795" stroke="#2A2118" stroke-width="1.4"/><rect x="90" y="417.5" width="186.24" height="34" fill="#FDFAF2" opacity="0.94"/><text x="96" y="445.5" font-size="22" text-anchor="start" fill="#2A2118" font-weight="normal">阶段高 60～80 m</text><text x="700" y="850" font-size="24" text-anchor="middle" fill="#2A2118" font-weight="bold">拉底→平衡拱→切帮上移→阶段崩落完毕→大量放矿 · 铜矿峪为国内唯一大规模成功应用</text><rect x="140" y="875" width="44" height="26" fill="url(#ore)" stroke="#2A2118" stroke-width="1.6"/><text x="194" y="895" font-size="22" text-anchor="start" fill="#2A2118" font-weight="normal">矿石</text><rect x="284" y="875" width="44" height="26" fill="url(#fillb)" stroke="#2A2118" stroke-width="1.6"/><text x="338" y="895" font-size="22" text-anchor="start" fill="#2A2118" font-weight="normal">崩落矿石</text><rect x="472" y="875" width="44" height="26" fill="url(#caved)" stroke="#2A2118" stroke-width="1.6"/><text x="526" y="895" font-size="22" text-anchor="start" fill="#2A2118" font-weight="normal">覆岩</text></svg>