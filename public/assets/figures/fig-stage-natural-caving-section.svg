<path d="M444 496 H520 L495 578 H469 Z" fill="url(#rubble)" stroke="#61737c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M595 496 H671 L646 578 H620 Z" fill="url(#rubble)" stroke="#61737c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="156" y="578" width="656" height="32" fill="#fffdf7" stroke="#61737c" stroke-width="2"/>
<path d="M481 302V235" fill="none" stroke="#166369" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M482 496V566" fill="none" stroke="#166369" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
