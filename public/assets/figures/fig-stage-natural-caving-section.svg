<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">阶段自然崩落法 · 矿块剖面</title>
<desc id="desc">矿块拉底后由下向上自然崩落。当前平衡拱与可能上移的拱线分开绘制，崩落矿石由底部出矿系统放出。</desc>
<defs>
<pattern id="ore" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#efd9b2"/><path d="M-6 6L6-6M0 12L12 0M6 18L18 6" stroke="#b37d43" stroke-width="1"/></pattern>
<pattern id="rock" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#e1e5e2"/><path d="M0 7h7m4 8h7" stroke="#a4afac" stroke-width="1"/></pattern>
<pattern id="rubble" width="22" height="20" patternUnits="userSpaceOnUse"><rect width="22" height="20" fill="#e7bc88"/><path d="M3 4l4-2 3 5-5 4ZM13 13l5-2 2 5-5 2Z" fill="none" stroke="#966041" stroke-width="1"/></pattern>
<pattern id="waste" width="27" height="24" patternUnits="userSpaceOnUse"><rect width="27" height="24" fill="#b9c4c6"/><path d="M2 3l6-1 4 6-5 5-4-3ZM15 15l6-4 4 5-3 5-6-1Z" fill="none" stroke="#6d7e83" stroke-width="1.2"/></pattern>
<pattern id="fill" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#b8d9ce"/><circle cx="4" cy="4" r="1.5" fill="#598b84"/><circle cx="11" cy="11" r="1.5" fill="#598b84"/></pattern>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth" viewBox="0 0 10 8"><path d="M0 0L9 4 0 8Z" fill="#166369"/></marker>
</defs>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
<rect x="0" y="0" width="1400" height="820" fill="#faf8f0" stroke="none" stroke-width="2"/>
<text x="57" y="78" text-anchor="start" fill="#263844" font-size="42" font-weight="700">阶段自然崩落法</text>
<text x="1343" y="72" text-anchor="end" fill="#61737c" font-size="25" font-weight="500">矿块剖面</text>
<path d="M57 105 L1343 105" fill="none" stroke="#61737c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M952 135 L952 678" fill="none" stroke="#b5bfba" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="80" y="170" width="810" height="456" fill="url(#rock)" stroke="#61737c" stroke-width="2"/>
<rect x="157" y="180" width="655" height="411" fill="url(#ore)" stroke="#61737c" stroke-width="2"/>
<path d="M197 496 Q481 185 773 496Z" fill="#fffdf7" stroke="#61737c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
