<text x="250" y="501" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">1</text>
<circle cx="425" cy="348" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="425" y="354" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">2</text>
<circle cx="796" cy="457" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="796" y="463" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">3</text>
<circle cx="481" cy="433" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="481" y="439" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">4</text>
<circle cx="631" cy="594" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="631" y="600" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">5</text>
<circle cx="992" cy="179" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="185" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">1</text>
<text x="1020" y="185" text-anchor="start" fill="#263844" font-size="25" font-weight="700">拉底水平</text>
<text x="1020" y="216" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">在矿块底部创造自由面</text>
<circle cx="992" cy="265" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="271" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">2</text>
<text x="1020" y="271" text-anchor="start" fill="#263844" font-size="25" font-weight="700">平衡拱</text>
<text x="1020" y="302" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">虚线表示拱线向上发展</text>
<circle cx="992" cy="351" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="357" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">3</text>
<text x="1020" y="357" text-anchor="start" fill="#263844" font-size="25" font-weight="700">切帮巷道</text>
<text x="1020" y="388" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">控制崩落边界</text>
<circle cx="992" cy="437" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="443" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">4</text>
<text x="1020" y="443" text-anchor="start" fill="#263844" font-size="25" font-weight="700">崩落矿石堆</text>
<text x="1020" y="474" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">堆顶与拱面之间是自由空间</text>
<circle cx="992" cy="523" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="529" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">5</text>
<text x="1020" y="529" text-anchor="start" fill="#263844" font-size="25" font-weight="700">底部出矿结构</text>
<text x="1020" y="560" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">通过漏斗和出矿巷道放矿</text>
<path d="M57 705 L1343 705" fill="none" stroke="#61737c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="62" y="733" width="31" height="21" fill="url(#ore)" stroke="#61737c" stroke-width="2"/>
<text x="103" y="751" text-anchor="start" fill="#263844" font-size="20" font-weight="500">未崩矿石</text>
<rect x="212" y="733" width="31" height="21" fill="url(#rubble)" stroke="#61737c" stroke-width="2"/>
<text x="253" y="751" text-anchor="start" fill="#263844" font-size="20" font-weight="500">崩落矿石</text>
<rect x="362" y="733" width="31" height="21" fill="#fffdf7" stroke="#61737c" stroke-width="2"/>
<text x="403" y="751" text-anchor="start" fill="#263844" font-size="20" font-weight="500">自由空间或巷道</text>
<text x="1343" y="751" text-anchor="end" fill="#61737c" font-size="21" font-weight="500">示意 · 非比例</text>
</g>
</svg>
