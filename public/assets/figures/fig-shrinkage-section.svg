<text x="274" y="751" text-anchor="start" fill="#263844" font-size="20" font-weight="500">崩落矿石</text>
<rect x="383" y="733" width="31" height="21" fill="url(#rock)" stroke="#61737c" stroke-width="2"/>
<text x="424" y="751" text-anchor="start" fill="#263844" font-size="20" font-weight="500">围岩</text>
