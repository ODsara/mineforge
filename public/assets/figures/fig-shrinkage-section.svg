530" x2="470" y2="530" stroke="#A6531F" stroke-width="2.4"/><text x="700" y="130" font-size="23" text-anchor="middle" fill="#2A2118" font-weight="normal">顶柱 2～3 m（薄脉）／3～6 m（中厚以上）</text><text x="700" y="676" font-size="23" text-anchor="middle" fill="#2A2118" font-weight="normal">底柱 4～6 m／8～10 m · 漏斗间距 5～7 m</text><line x1="330" y1="300" x2="120" y2="300" stroke="#2A2118" stroke-width="1.8"/><circle cx="330" cy="300" r="4" fill="#A6531F"/><rect x="119" y="263" width="219.0" height="35" fill="#FDFAF2" opacity="0.94"/><text x="125" y="292" font-size="23" text-anchor="start" fill="#2A2118" font-weight="normal">先进天井（间柱中）</text><line x1="430" y1="250" x2="120" y2="220" stroke="#2A2118" stroke-width="1.8"/><circle cx="430" cy="250" r="4" fill="#A6531F"/><rect x="119" y="183" width="204.27999999999997" height="35" fill="#FDFAF2" opacity="0.94"/><text x="125" y="212" font-size="23" text-anchor="start" fill="#2A2118" font-weight="normal">联络道 每 4～5 m</text><line x1="950" y1="470" x2="1210" y2="430" stroke="#2A2118" stroke-width="1.8"/><circle cx="950" cy="470" r="4" fill="#A6531F"/><rect x="1204" y="393" width="104.0" height="35" fill="#FDFAF2" opacity="0.94"/><text x="1210" y="422" font-size="23" text-anchor="start" fill="#2A2118" font-weight="normal">放矿漏斗</text><line x1="700" y1="570" x2="120" y2="560" stroke="#2A2118" stroke-width="1.8"/><circle cx="700" cy="570" r="4" fill="#A6531F"/><rect x="119" y="531" width="311.0" height="35" fill="#FDFAF2" opacity="0.94"/><text x="125" y="560" font-size="23" text-anchor="start" fill="#2A2118" font-weight="normal">工作空间（人在矿堆上凿岩）</text><line x1="80" y1="80" x2="80" y2="700" stroke="#2A2118" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="68" y1="80" x2="92" y2="80" stroke="#2A2118" stroke-width="1.4"/><line x1="68" y1="700" x2="92" y2="700" stroke="#2A2118" stroke-width="1.4"/><rect x="90" y="370.0" width="186.24" height="34" fill="#FDFAF2" opacity="0.94"/><text x="96" y="398.0" font-size="22" text-anchor="s