<text x="1020" y="357" text-anchor="start" fill="#263844" font-size="25" font-weight="700">人行通风天井</text>
<text x="1020" y="388" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">通过联络道进入矿房</text>
<circle cx="992" cy="437" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="443" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">4</text>
<text x="1020" y="443" text-anchor="start" fill="#263844" font-size="25" font-weight="700">放矿漏斗</text>
<text x="1020" y="474" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">连通矿房和底部巷道</text>
<circle cx="992" cy="523" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="529" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">5</text>
<text x="1020" y="529" text-anchor="start" fill="#263844" font-size="25" font-weight="700">顶柱与间柱</text>
<text x="1020" y="560" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">保留原岩支撑采场</text>
<path d="M57 705 L1343 705" fill="none" stroke="#61737c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
