<text x="1020" y="185" text-anchor="start" fill="#263844" font-size="25" font-weight="700">工作空间</text>
<text x="1020" y="216" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">位于矿堆上方</text>
<circle cx="992" cy="265" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="271" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">2</text>
<text x="1020" y="271" text-anchor="start" fill="#263844" font-size="25" font-weight="700">留矿堆</text>
<text x="1020" y="302" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">暂存的崩落矿石作为平台</text>
<circle cx="992" cy="351" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
