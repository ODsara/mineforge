<text x="57" y="78" text-anchor="start" fill="#263844" font-size="42" font-weight="700">浅孔留矿采矿法</text>
<text x="1343" y="72" text-anchor="end" fill="#61737c" font-size="25" font-weight="500">沿走向剖面</text>
