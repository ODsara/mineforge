<text x="1020" y="302" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">为崩落矿石提供容积</text>
<circle cx="992" cy="351" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
