<text x="1020" y="474" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">沿底部放矿结构下移</text>
<circle cx="992" cy="523" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
