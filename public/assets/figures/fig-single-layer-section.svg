</defs><rect width="1400" height="800" fill="#FDFAF2"/><rect x="120" y="120" width="1180" height="80" fill="#EFE6D4" stroke="#2A2118" stroke-width="2.4"/><text x="700" y="168" font-size="23" text-anchor="middle" fill="#2A2118" font-weight="normal">顶板：黑色页岩（易氧化自燃、不允许崩落）</text><rect x="120" y="200" width="620" height="120" fill="url(#fillb)" stroke="#2A2118" stroke-width="2.6"/><text x="420" y="270" font-size="23" text-anchor="middle" fill="#2A2118" font-weight="normal">充填体（水力/胶结）</text><rect x="740" y="200" width="220" height="120" fill="#FDFAF2" stroke="#2A2118" stroke-width="2.6"/><line x1="770" y1="210" x2="770" y2="310" stroke="#A6531F" stroke-width="4"/><rect x="748" y="200" width="44" height="16" fill="#EFE6D4" stroke="#2A2118" stroke-width="2"/><line x1="830" y1="210" x2="830" y2="310" stroke="#A6531F" stroke-width="4"/><rect x="808" y="200" width="44" height="16" fill="#EFE6D4" stroke="#2A2118" stroke-width="2"/><line x1="890" y1="210" x2="890" y2="310" stroke="#A6531F" stroke-width="4"/><rect x="868" y="200" width="44" height="16" fill="#EFE6D4" stroke="#2A2118" stroke-width="2"/><line x1="950" y1="210" x2="950" y2="310" stroke="#A6531F" stroke-width="4"/><rect x="928" y="200" width="44" height="16" fill="#EFE6D4" stroke="#2A2118" stroke-width="2"/><rect x="960" y="200" width="340" height="120" fill="url(#ore)" stroke="#2A2118" stroke-width="3"/><text x="1140" y="268" font-size="23" text-anchor="middle" fill="#2A2118" font-weight="normal">待采矿体（厚 0.8～3 m）</text><line x1="960" y1="200" x2="960" y2="320" stroke="#A6531F" stroke-width="5"/><rect x="814.62" y="161" width="290.76000000000005" height="35" fill="#FDFAF2" opacity="0.94"/><text x="960" y="190" font-size="23" text-anchor="middle" fill="#A6531F" font-weight="bold">壁式工作面（推进方向 ←）</text><rect x="760" y="440" width="20" height="70" fill="#FDFAF2" stroke="#2A2118" stroke-width="2.4"/><rect x="820" y="440" width="20" height="70" fill="#FDFAF2" stroke="#2A2118" stroke-width="2.4"/><rect x="880" y="440" width="20" height="70" fill="#FDFAF2" stroke="#2A2118" stroke-width="2.4"/><rect x="940" y="440" width="20" height="70" fill="#FDFAF2" stroke="#2A2118" stroke-width="2.4"/><rect x="120" y="320" width="1180" height="90" fill="url(#ore)" stroke="#2A2118" stroke-width="3"/><text x="700" y="372" font-size="23" text-anchor="middle" fill="#2A2118" font-weight="normal">矿层 0.8～3 m · 浅孔一次采全厚（孔深约 1 m）</text><rect x="120" y="410" width="1180" height="60" fill="#EFE6D4" stroke="#2A2118" stroke-width="2.4"/><text x="700" y="446" font-size="23" text-anchor="middle" fill="#2A2118" font-weight="normal">底板：砂岩（坚硬稳固）· 阶段运输巷道掘于底板岩石中（距底板 8～10 m）</text><line x1="740" y1="530" x2="960" y2="530" stroke="#2A2118" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="740" y1="518" x2="740" y2="542" stroke="#2A2118" stroke-width="1.4"/><line x1="960" y1="518" x2="960" y2="542" stroke="#2A2118" stroke-width="1.4"/><rect x="774.04" y="488" width="151.92000000000002" height="34" fill="#FDFAF2" opacity="0.94"/><text x="850.0" y="516" font-size="22" text-anchor="middle" fill="#2A2118" font-weight="normal">控顶距 2.4 m</text><line x1="120" y1="530" x2="740" y2="530" stroke="#2A2118" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="120" y1="518" x2="120" y2="542" stroke="#2A2118" stroke-width="1.4"/><line x1="740" y1="518" x2="740" y2="542" stroke="#2A2118" stroke-width="1.4"/><rect x="354.03999999999996" y="488" width="151.92000000000002" height="34" fill="#FDFAF2" opacity="0.94"/><text x="430.0" y="516" font-size="22" text-anchor="middle" fill="#2A2118" font-weight="normal">充填距 2.4 m</text><line x1="120" y1="575" x2="960" y2="575" stroke="#2A2118" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/><line x1="120" y1="563" x2="120" y2="587" stroke="#2A2118" stroke-width="1.4"/><line x1="960" y1="563" x2="960" y2="587" stroke="#2A2118" stroke-width="1.4"/><rect x="335.56" y="533" width="408.88" height="34" fill="#FDFAF2" opacity="0.94"/><text x="540.0" y="561" font-size="22" text-anchor="middle" fill="#2A2118" font-weight="normal">悬顶距 4.8 m（安全道间距 ≤ 悬顶距）</text><line x1="620" y1="240" x2="520" y2="150" stroke="#2A2118" stroke-width="1.8"/><circle cx="620" cy="240" r="4" fill="#A6531F"/><rect x="119" y="121" width="257.64" height="35" fill="#FDFAF2" opacity="0.94"/><text x="125" y="150" font-size="23" text-anchor="start" fill="#2A2118" font-weight="normal">砂门子（滤水 + 截料）</text><text x="700" y="640" font-size="25" text-anchor="middle" fill="#2A2118" font-weight="bold">壁式充填法：沿走向一次推进 2.4 m · 推进 4.8 m 充填 2.4 m · 边出矿边架棚</text><text x="700" y="676" font-size="22" text-anchor="middle" fill="#2A2118" font-weight="normal">水力充填逆倾斜由下而上分段拆除支柱并充填 · 台班效率 25～30 t</text><rect x="140" y="710" width="44" height="26" fill="url(#ore)" stroke="#2A2118" stroke-width="1.6"/><text x="194" y="730" font-size="22" text-anchor="start" fill="#2A2118" font-weight="normal">矿石</text><rect x="284" y="710" width="44" height="26" fill="url(#fillb)" stroke="#2A2118" stroke-width="1.6"/><text x="338" y="730" font-size="22" text-anchor="start" fill="#2A2118" font-weight="normal">充填体</text><rect x="450" y="710" width="44" height="26" fill="url(#caved)" stroke="#2A2118" stroke-width="1.6"/><text x="504" y="730" font-size="22" text-anchor="start" fill="#2A2118" font-weight="normal">崩落岩石</text></svg>