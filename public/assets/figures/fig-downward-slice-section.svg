</defs><rect width="1400" height="880" fill="#FDFAF2"/><rect x="120" y="80" width="120" height="720" fill="#EFE6D4" stroke="#2A2118" stroke-width="2"/><rect x="1180" y="80" width="120" height="720" fill="#EFE6D4" stroke="#2A2118" stroke-width="2"/><rect x="240" y="80" width="940" height="560" fill="url(#fillb)" stroke="#2A2118" stroke-width="3"/><line x1="240" y1="170" x2="1180" y2="170" stroke="#A6531F" stroke-width="3"/><line x1="240" y1="270" x2="1180" y2="270" stroke="#A6531F" stroke-width="3"/><line x1="240" y1="370" x2="1180" y2="370" stroke="#A6531F" stroke-width="3"/><line x1="240" y1="470" x2="1180" y2="470" stroke="#A6531F" stroke-width="3"/><rect x="484.24" y="101" width="431.52000000000004" height="35" fill="#FDFAF2" opacity="0.94"/><text x="700" y="130" font-size="23" text-anchor="middle" fill="#2A2118" font-weight="normal">已采分层（人工假顶 · 含钢筋网/底梁）</text><rect x="240" y="560" width="940" height="110" fill="#FDFAF2" stroke="#2A2118" stroke-width="3"/><rect x="240" y="560" width="300" height="110" fill="url(#fillb)" stroke="#2A2118" stroke-width="2.4"/><rect x="620" y="560" width="300" height="110" fill="url(#fillb)" stroke="#2A2118" stroke-width="2.4"/><rect x="980" y="560" width="200" height="110" fill="url(#fillb)" stroke="#2A2118" stroke-width="2.4"/><rect x="272.4" y="596" width="575.2" height="34" fill="#FDFAF2" opacity="0.94"/><text x="560" y="624" font-size="22" text-anchor="middle" fill="#2A2118" font-weight="normal">当前分层回采巷道（间隔开采 · 胶结方案宽 3.5～4 m）</text><rect x="240" y="670" width="940" height="70" fill="url(#ore)" stroke="#A6531F" stroke-width="2.6" stroke-dasharray="14 10"/><rect x="496.0" y="686" width="408.0" height="34" fill="#FDFAF2" opacity="0.94"/><text x="700" y="714" font-size="22" text-anchor="middle" fill="#A6531F" font-weight="normal">下一分层（至少待充填体达龄期后回采）</text><rect x="600" y="80" width="44" height="660" fill="#FDFAF2" stroke="#A6531F" stroke-width="2.6" stroke-dasharray="10 8"/><rect x="596.0" y="454" width="52.0" height="32" fill="#FDFAF2" opacity="0.94"/><text x="622" y="480" font-size="20" text-anchor="middle" fill="#2A2118" font-weight="normal">溜井</text><line x1="120" y1="740" x2="1300" y2="740" stroke="#2A2118" stroke-width="4"/><rect x="335.43999999999994" y="30" width="729.1200000000001" height="36" fill="#FDFAF2" opacity="0.94"/><text x="700" y="60" font-size="24" text-anchor="middle" fill="#A6531F" font-weight="bold">阶段高 30～50 m · 矿块长 30～50 m · 一步骤回采 · 自上而下</text><line x1="240" y1="300" x2="120" y2="300" stroke="#2A2118" stroke-width="1.8"/><circle cx="240" cy="300" r="4" fill="#A6531F"/><rect x="119" y="271" width="127.0" height="35" fill="#FDFAF2" opacity="0.94"/><text x="125" y="300" font-size="23" text-anchor="start" fill="#2A2118" font-weight="normal">胶结充填体</text><line x1="980" y1="615" x2="1385" y2="615" stroke="#2A2118" stroke-width="1.8"/><circle cx="980" cy="615" r="4" fill="#A6531F"/><rect x="989.8399999999999" y="586" width="401.16" height="35" fill="#FDFAF2" opacity="0.94"/><text x="1385" y="615" font-size="23" text-anchor="end" fill="#2A2118" font-weight="normal">高强侧帮充填体（灰砂比 1:4～1:5）</text><line x1="700" y1="720" x2="120" y2="700" stroke="#2A2118" stroke-width="1.8"/><circle cx="700" cy="720" r="4" fill="#A6531F"/><rect x="119" y="671" width="365.28" height="35" fill="#FDFAF2" opacity="0.94"/><text x="125" y="700" font-size="23" text-anchor="start" fill="#2A2118" font-weight="normal">回采巷道倾角 4°～10°（利接顶）</text><text x="700" y="790" font-size="24" text-anchor="middle" fill="#2A2118" font-weight="bold">下向分层充填：每层在上一分层人工假顶保护下回采 · 矿石损失 3%～5%</text><rect x="140" y="810" width="44" height="26" fill="url(#ore)" stroke="#2A2118" stroke-width="1.6"/><text x="194" y="830" font-size="22" text-anchor="start" fill="#2A2118" font-weight="normal">矿石（待采）</text><rect x="372" y="810" width="44" height="26" fill="url(#fillb)" stroke="#2A2118" stroke-width="1.6"/><text x="426" y="830" font-size="22" text-anchor="start" fill="#2A2118" font-weight="normal">充填体/人工假顶</text><rect x="648" y="810" width="44" height="26" fill="url(#caved)" stroke="#2A2118" stroke-width="1.6"/><text x="702" y="830" font-size="22" text-anchor="start" fill="#2A2118" font-weight="normal">崩落岩石</text></svg>