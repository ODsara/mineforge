<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" font-family="'Microsoft YaHei',sans-serif"><defs>
<pattern id="ore" width="18" height="18" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="18" height="18" fill="#E8D2B8"/><line x1="0" y1="0" x2="0" y2="18" stroke="#A6531F" stroke-width="2.2"/></pattern>
