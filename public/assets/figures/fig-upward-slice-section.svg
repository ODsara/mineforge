="start" fill="#2A2118" font-weight="normal">充填体</text><rect x="450" y="825" width="44" height="26" fill="url(#caved)" stroke="#2A2118" stroke-width="1.6"/><text x="504" y="845" font-size="22" text-anchor="start" fill="#2A2118" font-weight="normal">崩落岩石</text></svg>