<text x="1020" y="443" text-anchor="start" fill="#263844" font-size="25" font-weight="700">溜矿井</text>
<text x="1020" y="474" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">矿石向下进入运输水平</text>
<circle cx="992" cy="523" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="529" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">5</text>
<text x="1020" y="529" text-anchor="start" fill="#263844" font-size="25" font-weight="700">充填天井与管路</text>
<text x="1020" y="560" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">充填料送往作业区</text>
