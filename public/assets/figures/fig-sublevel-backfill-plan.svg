<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">分段充填采矿法 · 相邻分层进路平面</title>
<desc id="desc">盘区下向进路充填示例。对照两张同向平面，观察相邻分层进路的垂直交错，以及当前层采一条、充一条的组织方式。</desc>
<defs>
<pattern id="ore" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#efd9b2"/><path d="M-6 6L6-6M0 12L12 0M6 18L18 6" stroke="#b37d43" stroke-width="1"/></pattern>
<pattern id="rock" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#e1e5e2"/><path d="M0 7h7m4 8h7" stroke="#a4afac" stroke-width="1"/></pattern>
<pattern id="rubble" width="22" height="20" patternUnits="userSpaceOnUse"><rect width="22" height="20" fill="#e7bc88"/><path d="M3 4l4-2 3 5-5 4ZM13 13l5-2 2 5-5 2Z" fill="none" stroke="#966041" stroke-width="1"/></pattern>
<pattern id="waste" width="27" height="24" patternUnits="userSpaceOnUse"><rect width="27" height="24" fill="#b9c4c6"/><path d="M2 3l6-1 4 6-5 5-4-3ZM15 15l6-4 4 5-3 5-6-1Z" fill="none" stroke="#6d7e83" stroke-width="1.2"/></pattern>
<pattern id="fill" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#b8d9ce"/><circle cx="4" cy="4" r="1.5" fill="#598b84"/><circle cx="11" cy="11" r="1.5" fill="#598b84"/></pattern>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth" viewBox="0 0 10 8"><path d="M0 0L9 4 0 8Z" fill="#166369"/></marker>
</defs>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
<rect x="0" y="0" width="1400" height="820" fill="#faf8f0" stroke="none" stroke-width="2"/>
<text x="57" y="78" text-anchor="start" fill="#263844" font-size="42" font-weight="700">分段充填采矿法</text>
<text x="1343" y="72" text-anchor="end" fill="#61737c" font-size="25" font-weight="500">相邻分层进路平面</text>
<path d="M57 105 L1343 105" fill="none" stroke="#61737c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M952 135 L952 678" fill="none" stroke="#b5bfba" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="275" y="180" text-anchor="middle" fill="#263844" font-size="25" font-weight="700">上分层平面</text>
<rect x="92" y="208" width="366" height="346" fill="url(#ore)" stroke="#61737c" stroke-width="2"/>
<rect x="120" y="236" width="310" height="52" fill="url(#fill)" stroke="#61737c" stroke-width="2"/>
<rect x="120" y="310" width="310" height="52" fill="url(#fill)" stroke="#61737c" stroke-width="2"/>
<rect x="120" y="384" width="310" height="52" fill="url(#fill)" stroke="#61737c" stroke-width="2"/>
<rect x="120" y="458" width="310" height="52" fill="url(#fill)" stroke="#61737c" stroke-width="2"/>
<rect x="104" y="214" width="23" height="333" fill="#fffdf7" stroke="#61737c" stroke-width="2"/>
<text x="691" y="180" text-anchor="middle" fill="#263844" font-size="25" font-weight="700">当前分层平面</text>
<rect x="508" y="208" width="366" height="346" fill="url(#ore)" stroke="#61737c" stroke-width="2"/>
<rect x="547" y="232" width="52" height="298" fill="url(#fill)" stroke="#61737c" stroke-width="2"/>
<rect x="625" y="232" width="52" height="298" fill="url(#ore)" stroke="#61737c" stroke-width="2"/>
<rect x="703" y="232" width="52" height="298" fill="#fffdf7" stroke="#61737c" stroke-width="2"/>
<rect x="781" y="232" width="52" height="298" fill="url(#ore)" stroke="#61737c" stroke-width="2"/>
<rect x="522" y="528" width="338" height="22" fill="#fffdf7" stroke="#61737c" stroke-width="2"/>
<circle cx="281" cy="339" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="281" y="345" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">1</text>
<circle cx="572" cy="368" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="572" y="374" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">2</text>
<circle cx="647" cy="366" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="647" y="372" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">3</text>
<circle cx="726" cy="366" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="726" y="372" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">4</text>
<path d="M726 497V440" fill="none" stroke="#166369" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="483" y="607" text-anchor="middle" fill="#61737c" font-size="22" font-weight="500">上下两图同向，进路轴线在平面投影上互相垂直</text>
<circle cx="992" cy="179" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="185" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">1</text>
<text x="1020" y="185" text-anchor="start" fill="#263844" font-size="25" font-weight="700">上分层进路</text>
<text x="1020" y="216" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">沿水平方向排列，已充填</text>
<circle cx="992" cy="265" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="271" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">2</text>
<text x="1020" y="271" text-anchor="start" fill="#263844" font-size="25" font-weight="700">当前分层充填进路</text>
<text x="1020" y="302" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">与上层进路轴线垂直</text>
<circle cx="992" cy="351" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="357" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">3</text>
<text x="1020" y="357" text-anchor="start" fill="#263844" font-size="25" font-weight="700">待采间隔进路</text>
<text x="1020" y="388" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">保留间隔以组织回采</text>
<circle cx="992" cy="437" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="443" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">4</text>
<text x="1020" y="443" text-anchor="start" fill="#263844" font-size="25" font-weight="700">当前回采进路</text>
<text x="1020" y="474" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">回采后再胶结充填</text>
<path d="M57 705 L1343 705" fill="none" stroke="#61737c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="62" y="733" width="31" height="21" fill="url(#ore)" stroke="#61737c" stroke-width="2"/>
<text x="103" y="751" text-anchor="start" fill="#263844" font-size="20" font-weight="500">待采矿石</text>
<rect x="212" y="733" width="31" height="21" fill="url(#fill)" stroke="#61737c" stroke-width="2"/>
<text x="253" y="751" text-anchor="start" fill="#263844" font-size="20" font-weight="500">胶结充填体</text>
<rect x="383" y="733" width="31" height="21" fill="#fffdf7" stroke="#61737c" stroke-width="2"/>
<text x="424" y="751" text-anchor="start" fill="#263844" font-size="20" font-weight="500">进路或联络道</text>
<text x="1343" y="751" text-anchor="end" fill="#61737c" font-size="21" font-weight="500">示意 · 非比例</text>
</g>
</svg>
