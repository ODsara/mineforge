      <path d="M2 4h4m4 8h4" stroke="#b2bcb6"/>
    </pattern>
    <pattern id="ore" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#ecd3ab"/>
      <path d="M0 10 10 0" stroke="#ad7638"/>
    </pattern>
  </defs>
  <rect width="900" height="480" fill="#faf8f0"/>
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" fill="#263844" font-size="19">
    <path d="M45 114H246L328 102H555L651 114H855V414H45Z" fill="url(#rock)" stroke="#61737c" stroke-width="2"/>
    <path d="M488 115H574L706 413H608Z" fill="url(#ore)" stroke="#a4713f" stroke-width="2"/>
    <g fill="#fffdf7" stroke="#455c65" stroke-width="2">
      <path d="M149 114H172V383H149Z"/>
      <path d="M739 114H759V200H739Z"/>
