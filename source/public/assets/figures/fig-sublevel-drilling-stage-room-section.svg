      <text x="711" y="336">2</text>
      <text x="1252" y="289">3</text>
      <text x="520" y="388">4</text>
      <text x="490" y="562">5</text>
      <text x="727" y="600">6</text>
      <text x="814" y="271">7</text>
    </g>
    <g font-size="23">
      <text x="985" y="439">1　切割槽起始位置</text>
      <text x="985" y="478">2　分段凿岩巷道</text>
      <text x="985" y="517">3　上向扇形中深孔</text>
      <text x="985" y="556">4　垂直回采工作面</text>
      <text x="985" y="595">5　拉底空间与受矿漏斗</text>
      <text x="985" y="634">6　底部电耙道与溜井</text>
      <text x="985" y="673">7　通风人行天井</text>
    </g>
    <g stroke="#61737c" stroke-width="2">
      <rect x="62" y="762" width="31" height="21" fill="url(#ore)"/>
      <rect x="254" y="762" width="31" height="21" fill="url(#rubble)"/>
      <rect x="424" y="762" width="31" height="21" fill="#fffdf7"/>
      <rect x="642" y="762" width="31" height="21" fill="url(#rock)"/>
    </g>
    <g font-size="20">
      <text x="102" y="780">原矿与矿柱</text>
      <text x="295" y="780">崩落矿石</text>
      <text x="465" y="780">空场与巷道</text>
      <text x="683" y="780">围岩</text>
      <text x="1343" y="780" text-anchor="end" fill="#61737c">示意 · 非比例</text>
    </g>
  </g>
</svg>
