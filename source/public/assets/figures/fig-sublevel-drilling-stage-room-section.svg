<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">分段凿岩阶段矿房法 · 沿走向剖面与局部横剖面</title>
  <desc id="desc">切割槽提供初始自由面。各水平沿走向布置分段凿岩巷道，上向扇形孔位于垂直巷道轴线的横剖面内。崩落矿石落到同一矿房底部，经漏斗、电耙道和溜井进入阶段运输巷道。</desc>
  <defs>
    <pattern id="ore" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#efd9b2"/>
      <path d="M-6 6L6-6M0 12L12 0M6 18L18 6" stroke="#b37d43"/>
    </pattern>
    <pattern id="rock" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#e1e5e2"/>
      <path d="M0 7h7m4 8h7" stroke="#a4afac"/>
    </pattern>
    <pattern id="rubble" width="22" height="20" patternUnits="userSpaceOnUse">
      <rect width="22" height="20" fill="#e7bc88"/>
      <path d="M3 4l4-2 3 5-5 4ZM13 13l5-2 2 5-5 2Z" fill="none" stroke="#966041"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 8" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4 0 8Z" fill="#166369"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="#faf8f0"/>
  <g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" fill="#263844">
    <text x="57" y="78" font-size="42" font-weight="700">分段凿岩阶段矿房法</text>
    <text x="1343" y="72" text-anchor="end" fill="#61737c" font-size="25">纵剖面与局部横剖面</text>
    <path d="M57 105H1343M57 735H1343M953 135V709" fill="none" stroke="#9ca9a2" stroke-width="1.5"/>
    <text x="75" y="149" font-size="24" font-weight="700">沿走向纵剖面 · 底部集中出矿</text>
    <text x="985" y="149" font-size="24" font-weight="700">A–A 局部横剖面 · 单一分段</text>

    <g fill="#fffdf7" stroke="#61737c" stroke-width="2" stroke-linejoin="round">
      <rect x="72" y="174" width="843" height="526" fill="url(#rock)"/>
      <rect x="113" y="193" width="764" height="442" fill="url(#ore)"/>
      <path d="M187 236H517V543H187Z"/>
      <path d="M187 236H231V543H187Z" fill="#dce9e6" stroke="#779792" stroke-dasharray="7 5"/>
      <path d="M187 532L253 515 297 533 364 504 426 524 483 517 517 532V543H187Z" fill="url(#rubble)" stroke="#9d7552"/>
      <path d="M208 543H278L255 586H232ZM349 543H441L414 586H376ZM452 543H517L503 586H478Z" fill="url(#rubble)"/>
      <path d="M167 586H744V605H167Z"/>
      <path d="M727 605H744V661H727Z" fill="url(#rubble)"/>
      <path d="M121 661H863V680H121Z"/>
      <path d="M517 319H816V343H517M517 411H816V435H517M517 507H816V531H517"/>
      <path d="M799 218H819V605H744V586H799Z"/>
      <rect x="985" y="174" width="355" height="228" fill="url(#rock)"/>
      <path d="M1086 187H1243L1283 387H1118Z" fill="url(#ore)"/>
      <path d="M1156 380V355Q1156 343 1168 343H1194Q1206 343 1206 355V380Z"/>
    </g>

    <path d="M517 236V319M517 343V411M517 435V507" stroke="#9e4e18" stroke-width="4"/>
    <path d="M650 218V547" fill="none" stroke="#61737c" stroke-width="2" stroke-dasharray="7 7"/>
