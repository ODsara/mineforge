    <g fill="#61737c" font-size="19" text-anchor="middle">
      <text x="650" y="212">A</text>
      <text x="650" y="570">A</text>
    </g>
    <g fill="none" stroke="#166369" stroke-width="4.5" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M417 277H568"/>
      <path d="M395 444V516"/>
      <path d="M395 552V592H709"/>
      <path d="M735 616V657"/>
    </g>

    <path d="M431 675V716H420" fill="none" stroke="#61737c" stroke-width="1.5"/>
    <g font-size="20" text-anchor="middle">
