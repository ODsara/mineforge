<text x="708" y="376" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">3</text>
<text x="83" y="507" text-anchor="start" fill="#263844" font-size="24" font-weight="700">垂直进路轴线的横向布置</text>
