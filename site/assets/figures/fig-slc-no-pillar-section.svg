<path d="M486 629 V612 Q486 599 499 599 H525 Q538 599 538 612 V629 Z" fill="#fffdf7" stroke="#61737c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M697 629 V612 Q697 599 710 599 H736 Q749 599 749 612 V629 Z" fill="#fffdf7" stroke="#61737c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="300" cy="614" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="300" y="620" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">4</text>
<circle cx="992" cy="179" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="185" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">1</text>
<text x="1020" y="185" text-anchor="start" fill="#263844" font-size="25" font-weight="700">覆盖岩层</text>
<text x="1020" y="216" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">随放矿向下移动</text>
<circle cx="992" cy="265" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="271" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">2</text>
<text x="1020" y="271" text-anchor="start" fill="#263844" font-size="25" font-weight="700">本分段崩落矿石</text>
<text x="1020" y="302" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">在覆岩下向进路端部流动</text>
<circle cx="992" cy="351" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="357" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">3</text>
<text x="1020" y="357" text-anchor="start" fill="#263844" font-size="25" font-weight="700">回采进路端部</text>
<text x="1020" y="388" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">矿石由同一条进路运出</text>
<circle cx="992" cy="437" r="16" fill="#263844" stroke="#fffdf7" stroke-width="2"/>
<text x="992" y="443" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">4</text>
<text x="1020" y="443" text-anchor="start" fill="#263844" font-size="25" font-weight="700">上下分段进路</text>
<text x="1020" y="474" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">横向错开，形成交错布置</text>
<path d="M57 705 L1343 705" fill="none" stroke="#61737c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="62" y="733" width="31" height="21" fill="url(#ore)" stroke="#61737c" stroke-width="2"/>
<text x="103" y="751" text-anchor="start" fill="#263844" font-size="20" font-weight="500">原矿</text>
<rect x="170" y="733" width="31" height="21" fill="url(#rubble)" stroke="#61737c" stroke-width="2"/>
<text x="211" y="751" text-anchor="start" fill="#263844" font-size="20" font-weight="500">崩落矿石</text>
<rect x="320" y="733" width="31" height="21" fill="url(#waste)" stroke="#61737c" stroke-width="2"/>
<text x="361" y="751" text-anchor="start" fill="#263844" font-size="20" font-weight="500">覆岩</text>
<rect x="428" y="733" width="31" height="21" fill="#fffdf7" stroke="#61737c" stroke-width="2"/>
<text x="469" y="751" text-anchor="start" fill="#263844" font-size="20" font-weight="500">进路</text>
<text x="1343" y="751" text-anchor="end" fill="#61737c" font-size="21" font-weight="500">示意 · 非比例</text>
