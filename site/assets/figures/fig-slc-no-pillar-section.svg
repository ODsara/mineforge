<rect x="663" y="354" width="227" height="37" fill="#fffdf7" stroke="#61737c" stroke-width="2"/>
<path d="M603 269L639 314 660 367H809" fill="none" stroke="#166369" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
