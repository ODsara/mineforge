<text x="992" y="529" text-anchor="middle" fill="#fffdf7" font-size="16" font-weight="700">5</text>
<text x="1020" y="529" text-anchor="start" fill="#263844" font-size="25" font-weight="700">溜矿井</text>
<text x="1020" y="560" text-anchor="start" fill="#61737c" font-size="20" font-weight="500">通向下部运输水平</text>
